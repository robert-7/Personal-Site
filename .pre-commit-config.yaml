---
# Adding plugins: https://pre-commit.com/#plugins

repos:

  # general linting
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: fix-byte-order-marker
      - id: trailing-whitespace
        exclude: '^assets/fonts/fontawesome-webfont.svg$'
      - id: end-of-file-fixer
        exclude: '^CNAME$'
      - id: mixed-line-ending
        args: ['--fix=lf']
        description: Forces to replace line ending by the UNIX 'lf' character.

  # markdown linting
  - repo: https://github.com/markdownlint/markdownlint
    # Kept at v0.13.0 because validating newer releases currently fails here
    # while pre-commit builds Ruby 3.3.0 without the psych extension.
    rev: v0.13.0
    hooks:
      - id: markdownlint
        entry: mdl --style .markdownlint.rb

  # Modern CSS linting
  - repo: https://github.com/thibaudcolas/pre-commit-stylelint
    # Kept at v16.26.1 because newer versions are causing issues
    rev: v16.26.1
    hooks:
      - id: stylelint
        files: assets/custom/css/.*\.css$
        additional_dependencies:
          - stylelint@16.26.1
          - stylelint-config-standard@36.0.1
        args: [--fix]

  # JavaScript linting
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v10.2.1
    hooks:
      - id: eslint
        files: assets/custom/js/.*\.js$
        types: [file]
        additional_dependencies:
          - eslint@10.2.1

  # Universal Formatter
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [css, javascript, html, json]
        files: 'assets/custom/.*\.(css|js|json)$|^index.html$'

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        entry: yamllint -c .yamllint.yaml .

  # unicode character normalization
  - repo: https://github.com/sirosen/texthooks
    rev: 0.7.1
    hooks:
      - id: fix-smartquotes
      - id: fix-unicode-dashes
